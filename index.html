<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIDI Piano Roll Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>MIDI Piano Roll Viewer</h1>
</header>

<section class="panel">
  <input type="file" id="midiFile" accept=".mid,.midi" />

  <div class="controls">
    <button id="playBtn" disabled>▶</button>
    <button id="stopBtn" disabled>■</button>
  </div>
</section>

<section class="panel">
  <h2>Tracks</h2>
  <ul id="trackList"></ul>
</section>

<section class="panel">
  <h2>Piano Roll</h2>

  <div id="rollContainer">
    <div id="keyboardWrapper">
      <canvas id="keyboard"></canvas>
    </div>

    <div id="rollScroll">
      <canvas id="pianoRoll"></canvas>
    </div>
  </div>

  <div id="noteInfo">ノーツをタップすると音名が表示されます</div>
</section>

<script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
<script src="https://unpkg.com/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script src="main.js"></script>

</body>
</html>
