<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MIDI Piano Roll</title>

<link rel="stylesheet" href="style.css">

<script src="https://unpkg.com/tone@14.8.49/build/Tone.js"></script>
<script src="https://unpkg.com/@tonejs/midi/build/Midi.js"></script>
</head>

<body>

<header>
  <label class="file">
    MIDI
    <input type="file" id="midiInput" accept=".mid,.midi">
  </label>

  <button id="play">▶</button>
  <button id="stop">■</button>

  <label class="chk">
    <input type="checkbox" id="follow" checked>
    追従
  </label>
</header>

<div id="tracks"></div>

<div id="viewer">
  <canvas id="keyboard"></canvas>
  <div id="scroll">
    <canvas id="roll"></canvas>
  </div>
</div>

<div id="info">ノーツをタップすると音名表示</div>

<script src="main.js"></script>
</body>
</html>
